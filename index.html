<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول سهم برق</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Vazirmatn", sans-serif;
      color: #123f46;
      background:
        radial-gradient(circle at 10% 10%, rgba(8,217,214,.12), transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(0,170,175,.09), transparent 30%),
        #fff;
    }

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .smoke {
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      opacity: .17;
    }

    .smoke-1 {
      width: 420px;
      height: 420px;
      right: -150px;
      top: -170px;
      background: #00d9d6;
      animation: move1 14s ease-in-out infinite alternate;
    }

    .smoke-2 {
      width: 460px;
      height: 360px;
      left: -180px;
      bottom: -170px;
      background: #00aeb5;
      animation: move2 17s ease-in-out infinite alternate;
    }

    .smoke-3 {
      width: 280px;
      height: 280px;
      left: 35%;
      top: 40%;
      background: #04d7d4;
      opacity: .08;
      animation: move3 20s ease-in-out infinite alternate;
    }

    @keyframes move1 {
      to { transform: translate(-80px, 80px) scale(1.2); }
    }

    @keyframes move2 {
      to { transform: translate(100px, -70px) scale(1.2); }
    }

    @keyframes move3 {
      0% { transform: translate(0, 0); }
      50% { transform: translate(100px, -50px); }
      100% { transform: translate(-50px, 80px); }
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #05c9c7;
      box-shadow: 0 0 8px #05c9c7, 0 0 20px rgba(5,201,199,.45);
      animation: rise linear infinite;
    }

    @keyframes rise {
      0% {
        transform: translateY(110vh) scale(.3);
        opacity: 0;
      }
      10% { opacity: .8; }
      85% { opacity: .55; }
      100% {
        transform: translateY(-15vh) scale(1.1);
        opacity: 0;
      }
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: clamp(28px, 6vw, 65px) 15px 25px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      color: #008687;
      background: rgba(8,217,214,.09);
      border: 1px solid rgba(0,150,155,.15);
      font-size: 12px;
      font-weight: 800;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #08d9d6;
      box-shadow: 0 0 12px #08d9d6;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      50% {
        opacity: .25;
        transform: scale(.65);
      }
    }

    .title {
      margin: 14px 0 6px;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.4;
      font-weight: 900;
    }

    .subtitle {
      margin: 0;
      color: #648087;
      font-size: 13px;
      line-height: 1.8;
    }

    .table-card {
      padding: 10px;
      border-radius: 28px;
      border: 1px solid rgba(0,150,155,.16);
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 25px 70px rgba(0,110,120,.14),
        inset 0 1px 0 rgba(255,255,255,.8);
      overflow: hidden;
    }

    .table-wrapper {
      overflow: hidden;
      border-radius: 20px;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      direction: rtl;
    }

    col.unit {
      width: 35%;
    }

    col.water {
      width: 65%;
    }

    thead th {
      padding: 17px 10px;
      color: #fff;
      background: linear-gradient(135deg, #073943, #087c82 55%, #05bebb);
      font-size: 15px;
      font-weight: 800;
      text-align: center;
    }

    thead th:first-child {
      border-radius: 0 17px 0 0;
    }

    thead th:last-child {
      border-radius: 17px 0 0 0;
    }

    tbody td {
      padding: 16px 10px;
      border-bottom: 1px solid rgba(0,150,155,.15);
      background: rgba(255,255,255,.55);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.8;
      text-align: center;
      overflow-wrap: anywhere;
    }

    tbody tr:nth-child(even) td {
      background: rgba(245,255,255,.72);
    }

    tbody tr:hover td {
      background: rgba(8,217,214,.08);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .unit {
      color: #063d45;
      font-weight: 900;
      white-space: nowrap;
    }

    .water {
      color: #007d80;
      font-weight: 900;
      direction: rtl;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #648087;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.8;
    }

    .footer strong {
      color: #087d80;
      font-weight: 900;
    }

    @media (max-width: 600px) {
      .container {
        padding: 22px 10px 18px;
      }

      .hero {
        margin-bottom: 17px;
      }

      .badge {
        padding: 6px 10px;
        font-size: 10px;
      }

      .title {
        font-size: 27px;
      }

      .subtitle {
        font-size: 10px;
      }

      .table-card {
        padding: 5px;
        border-radius: 18px;
      }

      .table-wrapper {
        border-radius: 14px;
      }

      thead th {
        padding: 12px 6px;
        font-size: 12px;
      }

      tbody td {
        padding: 12px 5px;
        font-size: 11px;
      }

      .footer {
        margin-top: 15px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <span class="smoke smoke-1"></span>
    <span class="smoke smoke-2"></span>
    <span class="smoke smoke-3"></span>

    <span class="particle" style="left:5%;animation-duration:9s;animation-delay:-3s"></span>
    <span class="particle" style="left:15%;animation-duration:12s;animation-delay:-7s"></span>
    <span class="particle" style="left:25%;animation-duration:10s;animation-delay:-5s"></span>
    <span class="particle" style="left:37%;animation-duration:14s;animation-delay:-10s"></span>
    <span class="particle" style="left:49%;animation-duration:11s;animation-delay:-4s"></span>
    <span class="particle" style="left:61%;animation-duration:15s;animation-delay:-9s"></span>
    <span class="particle" style="left:73%;animation-duration:10s;animation-delay:-6s"></span>
    <span class="particle" style="left:84%;animation-duration:13s;animation-delay:-11s"></span>
    <span class="particle" style="left:94%;animation-duration:9s;animation-delay:-2s"></span>
  </div>

  <main class="container">

    <header class="hero">
      <div class="badge">
        <span class="badge-dot"></span>
        گزارش هزینه واحدها
      </div>

      <h1 class="title">سهم برق راه پله</h1>

      <p class="subtitle">
        جدول تفکیک‌شده سهم برق راه پله هر واحد
      </p>
    </header>

    <section class="table-card">
      <div class="table-wrapper">

        <table>
          <colgroup>
            <col class="unit">
            <col class="water">
          </colgroup>

          <thead>
            <tr>
              <th>واحد</th>
              <th>سهم برق راه پله</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td class="unit">واحد ۱</td>
              <td class="water">205,500 تومان</td>
            </tr>

            <tr>
              <td class="unit">واحد ۲</td>
              <td class="water">274,000 تومان</td>
            </tr>

            <tr>
              <td class="unit">واحد ۳</td>
              <td class="water">274,000 تومان</td>
            </tr>

            <tr>
              <td class="unit">واحد ۴</td>
              <td class="water">205,500 تومان</td>
            </tr>

            <tr>
              <td class="unit">واحد ۵</td>
              <td class="water">205,500 تومان</td>
            </tr>

          </tbody>
        </table>

      </div>
    </section>

    <footer class="footer">
      © <strong>ساخته شده توسط امیر مهدی یوسفی</strong>
    </footer>

  </main>

</body>
</html>
